name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan (git history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit
        working-directory: telegram-voice-bot
        run: |
          pip install pip-audit==2.7.3
          pip-audit --strict -r requirements.txt
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          retry-on-snapshot-warnings: true
  web-build:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install & verify Web Voice Bot
        run: |
          npm ci
          npm run lint
          npm run build
  build:
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-voice-bot
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: telegram-voice-bot/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov pytest-asyncio
      - name: Lint & Format check
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: |
          pip install mypy==1.11.2
          mypy bot/ main.py --ignore-missing-imports
      - name: Test
        run: python -m pytest -v --cov=
